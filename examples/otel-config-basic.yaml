
# To limit exposure to denial of service attacks, change the host in endpoints below from 0.0.0.0 to a specific network interface.
# See https://github.com/open-telemetry/opentelemetry-collector/blob/main/docs/security-best-practices.md#safeguards-against-denial-of-service-attacks

extensions:
  health_check:
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

  opencensus:
    endpoint: 0.0.0.0:55678

  # Collect own metrics
  prometheus:
    config:
      scrape_configs:
      - job_name: 'otel-collector'
        scrape_interval: 10s
        static_configs:
        - targets: ['0.0.0.0:8888']

  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_binary:
        endpoint: 0.0.0.0:6832
      thrift_compact:
        endpoint: 0.0.0.0:6831
      thrift_http:
        endpoint: 0.0.0.0:14268

  zipkin:
    endpoint: 0.0.0.0:9411

processors:
  batch:
    send_batch_size: 10
    timeout: 5s

exporters:
  elasticsearch/logs:
    endpoints: ["http://172.31.41.128:9200"]
    user: mule-logger
    password: "Mule1234"
    logs_index: mule-logs
    # Bypass dynamic mapping inference; we are writing to a plain index.
    mapping:
      mode: raw
  elasticsearch/traces:
    endpoints: ["http://172.31.41.128:9200"]
    user: mule-tracer
    password: "Mule1234"
    traces_index: mule-traces
    mapping:
      mode: raw
  debug:
    verbosity: detailed

service:

  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [elasticsearch/logs, debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [elasticsearch/traces]


